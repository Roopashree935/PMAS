name: Backend CI

# Lint + test the FastAPI backend on every push/PR touching backend/ or this
# workflow. Free for public repositories (issue #34). The test suite needs no
# database: health/auth tests bypass the lifespan, and the #26 regression
# tests spawn clean subprocesses with .env-only configuration.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Exit code 5 = "no tests collected": happens on PRs that predate the
        # tests directory (e.g. PRs opened before this CI PR merges). Treat as
        # pass so those PRs are not marked red for missing tests.
        run: |
          set +e
          pytest -v
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected on this ref - passing."
            exit 0
          fi
          exit $code
